name: repair-future100-runtime
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair timer declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("let nightTimer=null,nightTimeLeft=0;", "var nightTimer=null,nightTimeLeft=0;")
          s=s.replace("let ministerialTimer=null,ministerialTimeLeft=0;", "var ministerialTimer=null,ministerialTimeLeft=0;")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix timer TDZ that freezes page clicks"
          rm -f .github/workflows/repair-future100-runtime.yml
          git add .github/workflows/repair-future100-runtime.yml
          git commit --amend --no-edit
          git push