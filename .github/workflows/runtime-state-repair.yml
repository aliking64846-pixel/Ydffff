name: repair-runtime-state
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure runtime timer state is initialized first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("var ministerialTimer=null, ministerialTimeLeft=0;", "")
          s=s.replace("var nightTimer=null, nightTimeLeft=0;", "")
          marker="<script>\n"
          state="var ministerialTimer=null, ministerialTimeLeft=0;\nvar nightTimer=null, nightTimeLeft=0;\n"
          if marker in s and "/* GLOBAL RUNTIME STATE" not in s:
              s=s.replace(marker, marker+"/* GLOBAL RUNTIME STATE */\n"+state, 1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Initialize runtime timers before page handlers"
          git push