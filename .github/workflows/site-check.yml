name: Site integrity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in assets/js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check required site files and lesson data
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import json, re, sys

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          errors = []

          def local_path(reference):
              # Cache-busting query strings and fragments are not part of filenames.
              return urlsplit(reference).path

          for reference in re.findall(r'<script\s+src=["\']([^"\']+)["\']', html):
              if reference.startswith(("http://", "https://", "//")):
                  continue
              path = local_path(reference)
              if path and not (root / path).is_file():
                  errors.append(f"Missing script: {reference}")

          for reference in re.findall(r'<link[^>]+href=["\']([^"\']+)["\']', html):
              if reference.startswith(("http://", "https://", "//", "#")):
                  continue
              path = local_path(reference)
              if path and not (root / path).is_file():
                  errors.append(f"Missing stylesheet/resource: {reference}")

          for name in ("book-front.txt", "book-geography.txt", "book-history.txt", "book-national.txt"):
              if not (root / name).is_file():
                  errors.append(f"Missing textbook file: {name}")

          app = (root / "assets/js/app.js").read_text(encoding="utf-8")
          match = re.search(r'const lessons = (\[.*?\]);', app, re.S)
          if not match:
              errors.append("Could not locate lesson data in app.js")
          else:
              try:
                  lessons = json.loads(match.group(1))
                  if len(lessons) != 62:
                      errors.append(f"Expected 62 lessons, found {len(lessons)}")
              except Exception as exc:
                  errors.append(f"Lesson data is not valid JSON: {exc}")

          if errors:
              print("\\n".join("ERROR: " + item for item in errors))
              sys.exit(1)
          print("OK: local files exist and all 62 lessons are present.")
          PY
      - name: Validate ministerial source integrity
        run: |
          node <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.runInNewContext(fs.readFileSync('assets/js/ministerial-bank.js', 'utf8'), context);
          const bank = context.window.Future100MinisterialBank;
          if (!bank || typeof bank.all !== 'function' || typeof bank.isVerifiedQuestion !== 'function') {
            throw new Error('Ministerial bank API is missing');
          }
          const questions = bank.all();
          const invalid = questions.filter(q => !bank.isVerifiedQuestion(q));
          if (invalid.length) throw new Error('Unverified questions leaked into the trusted bank');
          if (questions.some(q => !q.question || !q.answer || !q.sourceId || !q.sourceUrl)) {
            throw new Error('Trusted question has missing text, answer, or source');
          }
          const ids = questions.map(q => q.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate trusted question IDs');
          console.log('OK: trusted questions have text, answers, source records, and unique IDs (' + questions.length + ').');
          JS
      - name: Validate content engine safety rules
        run: |
          node --check assets/js/study-content.js
          node --check assets/js/learning-engine.js
          node - <<'JS'
          const fs = require('fs');
          const content = fs.readFileSync('assets/js/study-content.js', 'utf8');
          if (content.includes(".map(q=>({...q,verified:true")) {
            throw new Error('Study content must not promote every question to verified');
          }
          if (!content.includes("q.verified===true&&q.sourceId&&q.sourceUrl")) {
            throw new Error('Study content source validation is missing');
          }
          const app = fs.readFileSync('assets/js/app.js', 'utf8');
          if (!app.includes('bindHeaderSearch') || !app.includes("closest('.mMenu')")) {
            throw new Error('Header search or mobile menu binding is missing');
          }
          console.log('OK: study content and main navigation safety checks passed.');
          JS
